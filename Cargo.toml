[package]
name = "cynapse-mini"
version = "1.0.0"
edition = "2021"
authors = ["Alartist40"]
license = "MIT OR Apache-2.0"
description = "Lightweight Rust AI agent for embedded systems and Raspberry Pi"
repository = "https://github.com/Alartist40/cynapse-mini"
keywords = ["ai", "agent", "cli", "embedded", "raspberry-pi"]
categories = ["command-line-utilities"]

[[bin]]
name = "cynapse-mini"
path = "src/main.rs"

[lib]
name = "cynapse_mini"
path = "src/lib.rs"

[dependencies]
# Async runtime - minimal features for size
tokio = { version = "1.36", default-features = false, features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "process", "fs"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }

# HTTP client - minimal features
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
async-trait = "0.1"
futures = "0.3"
shellexpand = "3.1"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = "z"          # Optimize for size
lto = "fat"              # Full link-time optimization
codegen-units = 1        # Better optimization
strip = true             # Remove debug symbols
panic = "abort"          # Smaller binary

[profile.dev]
opt-level = 0
incremental = true
