[package]
name = "cynapse"
version = "0.1.0"
edition = "2021"
authors = ["Cynapse Team"]
description = "Pure Rust AI Agent System: 3-tier LLM engine, REPL TUI, atomic-agent local tools, and Dendrite graph memory."
license = "MIT"

[workspace]
members = [
    ".",
    "harness/cynapse-core",
    "harness/cynapse-tui",
    "engine/cynapse-engine",
    "engine/leafcutter_core/rust",
    "memory/cynapse-memory",
]

[[bin]]
name = "cynapse"
path = "harness/src/main.rs"

[dependencies]
cynapse-core = { path = "harness/cynapse-core" }
cynapse-tui = { path = "harness/cynapse-tui" }
cynapse-engine = { path = "engine/cynapse-engine" }
cynapse-memory = { path = "memory/cynapse-memory" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
dirs = "6.0"
