# Cynapse System Configuration

[system]
name = "cynapse"
version = "0.1.0"

[engine]
# Cynapse managed llama-server daemon uses port 38265.
tier1_endpoint = "http://127.0.0.1:38265"
default_model = "Ornith-1.5-9B-Q4_K_M.gguf"
memory_headroom_mb = 1536
# Prompt context size for the Cynapse engine.
ctx_size = 4096
# GPU layers offloaded to Vulkan/ROCm on AMD Cezanne Radeon Graphics (boosts inference speed)
gpu_layers = 20
# Optional extra directories to search for local GGUF models.
model_search_paths = []

# Shared sampling defaults (chat). Applied to every provider from one config
# so Ollama options and llama-server payloads cannot drift apart.
[sampling]
temperature = 0.7
top_p = 0.9
top_k = 40
repeat_penalty = 1.05
repeat_last_n = 256

[memory]
subsystem = "DENDRITE"
database_path = "data/dendrite.db"
cache_ttl_seconds = 300
core_node_budget = 0.40
