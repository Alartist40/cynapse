[package]
name = "cynapse-core"
version = "0.1.0"
edition = "2021"
description = "Core Agent Harness, atomic-agent local tools, grep, and HF downloader in Rust."
license = "MIT"

[lib]
name = "cynapse_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
regex = "1"
dirs = "6.0"
toml = "0.8"
cynapse-engine = { path = "../../engine/cynapse-engine" }
cynapse-memory = { path = "../../memory/cynapse-memory" }
